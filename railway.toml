# Railway deployment config for AgentReady/Dokploy (cloud mode).
# 1. Connect this repo in Railway and add a Postgres plugin (Railway provides DATABASE_URL).
# 2. Set the variables listed in scripts/railway-setup.env.example in the Railway dashboard (or via CLI).
# 3. Deploy; the Dockerfile.railway build will run and start the app.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
# Healthcheck disabled so deploy can succeed; check logs if the app doesn’t load.
# Re-enable once startup is fast enough: healthcheckPath = "/api/health", healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
